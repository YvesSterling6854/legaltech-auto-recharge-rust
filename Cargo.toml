[package]
name = "legaltech-auto-recharge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "legal-service"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
